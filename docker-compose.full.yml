name: openlake-commerce-platform-full

services:
  datahub-mysql:
    image: mysql:8.4
    profiles: ["catalog", "full"]
    environment:
      MYSQL_DATABASE: datahub
      MYSQL_USER: datahub
      MYSQL_PASSWORD: datahub
      MYSQL_ROOT_PASSWORD: datahub
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    volumes:
      - datahub_mysql:/var/lib/mysql
    networks:
      - openlake

  datahub-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.23
    profiles: ["catalog", "full"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - datahub_elasticsearch:/usr/share/elasticsearch/data
    networks:
      - openlake

  datahub-gms:
    image: acryldata/datahub-gms:${DATAHUB_VERSION:-v1.0.0}
    profiles: ["catalog", "full"]
    environment:
      DATAHUB_SERVER_TYPE: quickstart
      DATAHUB_TELEMETRY_ENABLED: "false"
      EBEAN_DATASOURCE_DRIVER: com.mysql.cj.jdbc.Driver
      EBEAN_DATASOURCE_URL: jdbc:mysql://datahub-mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8
      EBEAN_DATASOURCE_USERNAME: datahub
      EBEAN_DATASOURCE_PASSWORD: datahub
      ELASTICSEARCH_HOST: datahub-elasticsearch
      ELASTICSEARCH_PORT: 9200
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    ports:
      - "8085:8080"
    depends_on:
      - datahub-mysql
      - datahub-elasticsearch
      - kafka
    networks:
      - openlake

  datahub-frontend:
    image: acryldata/datahub-frontend-react:${DATAHUB_VERSION:-v1.0.0}
    profiles: ["catalog", "full"]
    environment:
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: 8080
      DATAHUB_SECRET: local-datahub-secret
    ports:
      - "9002:9002"
    depends_on:
      - datahub-gms
    networks:
      - openlake

  datahub-ingestion:
    image: acryldata/datahub-ingestion:${DATAHUB_VERSION:-v1.0.0-slim}
    profiles: ["catalog", "full"]
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./infra/datahub/recipes:/recipes:ro
      - ./dbt:/dbt:ro
    depends_on:
      - datahub-gms
    networks:
      - openlake

networks:
  openlake:
    external: false

volumes:
  datahub_mysql:
  datahub_elasticsearch:
