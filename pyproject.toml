[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openlake-commerce-platform"
version = "0.1.0"
description = "A production-style local modern data platform for ecommerce CDC, lakehouse analytics, quality, lineage, BI, and API serving."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenLake Commerce Platform" }]
dependencies = [
  "cachetools>=5.3",
  "faker>=24.0",
  "fastapi>=0.110",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "psycopg[binary]>=3.1",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "structlog>=24.1",
  "tenacity>=8.2",
  "trino>=0.329",
  "uvicorn[standard]>=0.27"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "httpx>=0.27"
]
orchestration = [
  "dagster>=1.8",
  "dagster-dbt>=0.24",
  "dagster-webserver>=1.8",
  "openlineage-python>=1.20"
]
quality = [
  "great-expectations>=1.0"
]
transform = [
  "dbt-core>=1.8",
  "dbt-trino>=1.8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
