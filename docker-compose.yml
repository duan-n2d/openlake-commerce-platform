name: openlake-commerce-platform

x-python-service: &python-service
  build:
    context: .
    dockerfile: infra/python.Dockerfile
  env_file: .env
  volumes:
    - ./:/app
  working_dir: /app
  networks:
    - openlake

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.4}
    profiles: ["core", "full"]
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commerce}
      POSTGRES_USER: ${POSTGRES_USER:-commerce_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce_app}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-debezium}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-debezium}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - openlake

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.0.0}
    profiles: ["core", "streaming", "full"]
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - openlake

  debezium:
    image: ${DEBEZIUM_IMAGE:-debezium/connect:3.1.0.Final}
    profiles: ["core", "streaming", "full"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: openlake-connect
      CONFIG_STORAGE_TOPIC: openlake_connect_configs
      OFFSET_STORAGE_TOPIC: openlake_connect_offsets
      STATUS_STORAGE_TOPIC: openlake_connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      ENABLE_DEBEZIUM_SCRIPTING: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - openlake

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    profiles: ["lakehouse", "full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - openlake

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-04-16T18-13-26Z}
    profiles: ["lakehouse", "full"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/init_minio.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-openlake}
    volumes:
      - ./infra/minio/init_minio.sh:/scripts/init_minio.sh:ro
    networks:
      - openlake

  polaris:
    image: ${POLARIS_IMAGE:-apache/polaris:1.5.0}
    profiles: ["lakehouse", "full"]
    ports:
      - "8181:8181"
      - "8182:8182"
    environment:
      POLARIS_BOOTSTRAP_CREDENTIALS: ${POLARIS_REALM:-POLARIS},${POLARIS_CLIENT_ID:-root},${POLARIS_CLIENT_SECRET:-s3cr3t}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8181/q/health >/dev/null || curl -fsS http://localhost:8181/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - openlake

  trino:
    image: ${TRINO_IMAGE:-trinodb/trino:476}
    profiles: ["lakehouse", "full"]
    ports:
      - "8080:8080"
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro
      - ./infra/trino/config.properties:/etc/trino/config.properties:ro
      - ./infra/trino/jvm.config:/etc/trino/jvm.config:ro
    depends_on:
      polaris:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - openlake

  flink-jobmanager:
    image: ${FLINK_IMAGE:-flink:1.20.0-scala_2.12-java17}
    profiles: ["streaming", "full"]
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 2
    volumes:
      - ./flink_jobs:/opt/flink/usrlib
      - ./infra/flink/lib:/opt/flink/plugins/openlake
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - openlake

  flink-taskmanager:
    image: ${FLINK_IMAGE:-flink:1.20.0-scala_2.12-java17}
    profiles: ["streaming", "full"]
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
    depends_on:
      - flink-jobmanager
    volumes:
      - ./flink_jobs:/opt/flink/usrlib
      - ./infra/flink/lib:/opt/flink/plugins/openlake
    networks:
      - openlake

  api:
    <<: *python-service
    profiles: ["core", "full"]
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  dagster:
    <<: *python-service
    profiles: ["quality", "full"]
    command: ["dagster", "dev", "-h", "0.0.0.0", "-p", "3000", "-m", "dagster_project.definitions"]
    ports:
      - "3000:3000"
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
    volumes:
      - ./:/app
      - dagster_home:/opt/dagster/dagster_home

  superset:
    image: ${SUPERSET_IMAGE:-apache/superset:4.1.1}
    profiles: ["bi", "full"]
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-for-local-dev}
    volumes:
      - ./infra/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/dashboards:/app/imports:ro
      - superset_home:/app/superset_home
    command: ["/bin/sh", "-c", "superset db upgrade && superset fab create-admin --username admin --firstname OpenLake --lastname Admin --email admin@example.com --password admin || true && superset init && superset run -h 0.0.0.0 -p 8088"]
    depends_on:
      trino:
        condition: service_started
    networks:
      - openlake

networks:
  openlake:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  dagster_home:
  superset_home:
