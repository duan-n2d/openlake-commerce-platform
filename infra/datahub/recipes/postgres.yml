  config:
    host_port: postgres:5432
    database: commerce
    username: commerce_app
    password: commerce_app
    include_tables: true
    include_views: true
    schema_pattern:
      allow:
        - commerce
sink:
  type: datahub-rest
  config:
    server: http://datahub-gms:8080
